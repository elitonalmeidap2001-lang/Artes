name: Publicar aplicativo Windows

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publicar-windows.yml

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar executável portátil
        shell: pwsh
        run: |
          dotnet publish windows/PainelEmFolhas.Portatil.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash release/PainelEmFolhas.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PainelEmFolhas.exe" | Set-Content release/SHA256SUMS.txt
      - name: Publicar no GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 release/PainelEmFolhas.exe release/SHA256SUMS.txt --title "Painel em Folhas 1.0.0 para Windows" --notes "Aplicativo portátil para Windows. Requer Microsoft Edge WebView2 Runtime."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
